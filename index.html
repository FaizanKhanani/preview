<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your Website Preview</title>
<meta name="description" content="A free website preview made for your business by TekShove.">
<meta property="og:title" content="Your new website preview">
<meta property="og:description" content="We designed this free preview for your business. Tap to see it.">
<meta property="og:image" content="https://images.unsplash.com/photo-1559339352-11d035aa65de?w=1200&h=630&fit=crop&q=70">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://images.unsplash.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,500&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0d0b;--bg2:#17150f;--ink:#f4ede1;--muted:#b3a993;--accent:#e2a64b;--accent-ink:#1a1206;--line:rgba(244,237,225,.14);--card:rgba(255,255,255,.04);--display:'Fraunces',serif;--body:'Manrope',system-ui,sans-serif;--radius:22px}
body.salon{--bg:#f7efe9;--bg2:#efe3da;--ink:#2a1622;--muted:#7d6670;--accent:#8c3b5e;--accent-ink:#fff;--line:rgba(42,22,34,.12);--card:#fffaf6;--display:'Cormorant Garamond',serif}
body.tour{--bg:#f2f6f7;--bg2:#e2ecee;--ink:#0b2433;--muted:#4f6a76;--accent:#ff6b4a;--accent-ink:#fff;--line:rgba(11,36,51,.12);--card:#fff;--display:'DM Serif Display',serif}
body.guesthouse{--bg:#f4efe6;--bg2:#e9e1d2;--ink:#132a2e;--muted:#5f716f;--accent:#0f6e6a;--accent-ink:#fff;--line:rgba(19,42,46,.12);--card:#fffdf8;--display:'DM Serif Display',serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
.ribbon{position:fixed;top:0;left:0;right:0;z-index:50;background:var(--accent);color:var(--accent-ink);font-size:12.5px;font-weight:600;letter-spacing:.02em;text-align:center;padding:7px 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:31px}
.ribbon b{font-weight:800}
/* NAV */
nav{position:fixed;top:31px;left:0;right:0;z-index:40;transition:.35s}
nav .in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 22px;max-width:1180px;margin:0 auto}
nav.solid{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-size:24px;font-weight:600;letter-spacing:.01em;color:#fff;text-decoration:none;line-height:1.1}
nav.solid .brand{color:var(--ink)}
.links{display:flex;gap:26px;font-size:14px;font-weight:600}
.links a{text-decoration:none;color:rgba(255,255,255,.85)}
nav.solid .links a{color:var(--ink)}
.pillbtn{display:inline-flex;align-items:center;gap:9px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:700;font-size:14.5px;padding:13px 22px;border-radius:999px;border:0;cursor:pointer;transition:transform .2s,box-shadow .2s;white-space:nowrap}
.pillbtn:hover{transform:translateY(-2px);box-shadow:0 12px 30px -10px var(--accent)}
.pillbtn.line{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.55)}
.pillbtn svg{width:18px;height:18px}
/* HERO */
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;color:#fff;overflow:hidden}
.hero .bgimg{position:absolute;inset:0;background-size:cover;background-position:center;animation:kb 18s ease-out forwards;transform-origin:60% 40%}
@keyframes kb{from{transform:scale(1.18)}to{transform:scale(1)}}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.35) 55%,rgba(0,0,0,.1) 100%),linear-gradient(180deg,rgba(0,0,0,.5) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,.2) 60%,rgba(0,0,0,.9) 100%)}
.hero .content{position:relative;z-index:2;width:100%;padding-bottom:70px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;margin-bottom:20px}
.eyebrow:before{content:"";width:34px;height:1.5px;background:var(--accent)}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(46px,8.5vw,112px);line-height:.95;letter-spacing:-.02em;max-width:900px}
.hero h1 em{font-style:italic;color:var(--accent)}
body.salon .hero h1 em,body.guesthouse .hero h1 em,body.tour .hero h1 em{color:#ffd9a8}
body.tour .hero h1{font-size:clamp(42px,6.8vw,90px);line-height:1}
body.guesthouse .hero h1{font-size:clamp(42px,6.6vw,86px);line-height:1}
.hero p.lead{font-size:clamp(16px,2vw,19px);max-width:540px;margin:24px 0 32px;color:rgba(255,255,255,.88)}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.hero .meta{display:flex;gap:34px;flex-wrap:wrap;margin-top:44px;padding-top:26px;border-top:1px solid rgba(255,255,255,.22)}
.meta div{font-size:13px;color:rgba(255,255,255,.75)}
.meta b{display:block;font-family:var(--display);font-size:30px;font-weight:400;color:#fff;line-height:1.1}
.open{display:inline-flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 0 rgba(61,220,132,.7);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}
/* SECTIONS */
section{padding:110px 0}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:30px;flex-wrap:wrap;margin-bottom:54px}
.kicker{font-size:12.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
h2{font-family:var(--display);font-weight:400;font-size:clamp(36px,5.2vw,64px);line-height:1;letter-spacing:-.015em}
h2 em{font-style:italic;color:var(--accent)}
.sec-head p{max-width:420px;color:var(--muted)}
/* STORY */
.story{display:grid;grid-template-columns:1.05fr .95fr;gap:70px;align-items:center}
.story .imgs{position:relative;aspect-ratio:4/5}
.story .imgs img{position:absolute;object-fit:cover;border-radius:var(--radius);box-shadow:0 30px 60px -25px rgba(0,0,0,.5)}
.story .imgs img:first-child{inset:0 22% 14% 0;width:78%;height:86%}
.story .imgs img:last-child{right:0;bottom:0;width:52%;height:52%;border:8px solid var(--bg)}
body.salon .story .imgs img:first-child{border-radius:300px 300px var(--radius) var(--radius)}
.story p{color:var(--muted);font-size:17px;margin:22px 0}
.feats{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:30px}
.feat{border-top:1px solid var(--line);padding-top:16px}
.feat b{display:block;font-family:var(--display);font-size:22px;font-weight:400}
.feat span{font-size:14px;color:var(--muted)}
/* MENU / SERVICES */
.menu-tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:36px}
.tab{border:1px solid var(--line);background:transparent;color:var(--ink);font:600 14px var(--body);padding:10px 20px;border-radius:999px;cursor:pointer;transition:.2s}
.tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 70px}
.item{display:grid;grid-template-columns:76px 1fr auto;gap:18px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line);animation:fadeUp .5s both}
.item img{width:76px;height:76px;border-radius:16px;object-fit:cover}
.item h4{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.2}
.item p{font-size:14px;color:var(--muted)}
.item .price{font-weight:700;color:var(--accent);white-space:nowrap}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* ROOMS */
.rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.room{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:transform .3s}
.room:hover{transform:translateY(-6px)}
.room .ph{aspect-ratio:4/3;overflow:hidden}
.room .ph img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.room:hover .ph img{transform:scale(1.06)}
.room .bd{padding:22px 24px 26px}
.room h4{font-family:var(--display);font-weight:400;font-size:26px}
.room p{color:var(--muted);font-size:14.5px;margin:6px 0 16px}
.room .row{display:flex;justify-content:space-between;align-items:center}
.room .rate{font-weight:700}
.room .rate small{font-weight:500;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tags span{font-size:12px;font-weight:600;background:var(--bg2);padding:5px 10px;border-radius:999px}
/* GALLERY */
.gallery{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:280px 280px;gap:14px}
.gallery figure{overflow:hidden;border-radius:18px;position:relative}
.gallery figure:nth-child(1){grid-row:span 2}
.gallery img{width:100%;height:100%;object-fit:cover;transition:transform .8s}
.gallery figure:hover img{transform:scale(1.07)}
/* REVIEWS */
.rev-band{background:var(--bg2);overflow:hidden}
.score{display:flex;align-items:center;gap:22px;margin-bottom:46px;flex-wrap:wrap}
.score .big{font-family:var(--display);font-size:96px;line-height:.9}
.stars{color:#f5b301;letter-spacing:3px;font-size:20px}
.marquee{display:flex;gap:22px;width:max-content;animation:scroll 48s linear infinite}
.marquee:hover{animation-play-state:paused}
@keyframes scroll{to{transform:translateX(-50%)}}
.rcard{width:380px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px}
.rcard p{font-family:var(--display);font-size:21px;line-height:1.4;margin:14px 0 18px}
body.salon .rcard p{font-size:23px}
.rcard .who{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.av{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700}
/* BOOK */
.book{display:grid;grid-template-columns:1fr 1fr;gap:0;border-radius:30px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.book .img{background-size:cover;background-position:center;min-height:520px;position:relative}
.book .img:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.55),transparent 55%)}
.book .img .cap{position:absolute;left:30px;bottom:28px;z-index:2;color:#fff;font-family:var(--display);font-size:30px;line-height:1.15;max-width:320px}
.book form{padding:54px 50px}
.book h3{font-family:var(--display);font-weight:400;font-size:40px;line-height:1.05;margin-bottom:8px}
.book .sub{color:var(--muted);margin-bottom:28px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
input,select{font:500 15px var(--body);padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);outline:none;width:100%}
input:focus,select:focus{border-color:var(--accent)}
.book .pillbtn{width:100%;justify-content:center;margin-top:20px;padding:17px}
.note{font-size:13px;color:var(--muted);margin-top:14px;text-align:center}
/* VISIT */
.visit{display:grid;grid-template-columns:.9fr 1.1fr;gap:28px}
.vcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:34px}
.vcard h4{font-family:var(--display);font-weight:400;font-size:24px;margin-bottom:12px}
.hours{width:100%;border-collapse:collapse;font-size:15px}
.hours td{padding:9px 0;border-bottom:1px solid var(--line)}
.hours td:last-child{text-align:right;color:var(--muted)}
.hours tr.today td{color:var(--accent);font-weight:700}
.map{border-radius:var(--radius);overflow:hidden;min-height:420px;border:1px solid var(--line)}
.map iframe{width:100%;height:100%;min-height:420px;border:0;filter:saturate(.85)}
body:not(.salon):not(.guesthouse) .map iframe{filter:invert(.9) hue-rotate(180deg) saturate(.6)}
/* FOOTER */
footer{padding:70px 0 120px;border-top:1px solid var(--line)}
.fbig{font-family:var(--display);font-size:clamp(40px,8vw,96px);line-height:1;letter-spacing:-.02em;margin-bottom:30px}
.frow{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.credit{display:inline-flex;align-items:center;gap:8px}
.credit b{color:var(--ink)}
/* MOBILE BAR */
.mbar{display:none}
.wa-float{position:fixed;right:22px;bottom:22px;z-index:45;width:62px;height:62px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 14px 34px -8px rgba(37,211,102,.7);animation:bob 3s ease-in-out infinite}
.wa-float svg{width:32px;height:32px;fill:#fff}
@keyframes bob{50%{transform:translateY(-6px)}}
/* REVEAL */
.rv{opacity:0;transform:translateY(34px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
@media(max-width:900px){
 .links{display:none}
 nav .pillbtn{display:none}
 section{padding:76px 0}
 .story,.book,.visit{grid-template-columns:1fr}
 .story{gap:40px}
 .menu-grid{grid-template-columns:1fr}
 .rooms{grid-template-columns:1fr}
 .gallery{grid-template-columns:1fr 1fr;grid-template-rows:none;grid-auto-rows:150px}
 .gallery figure:nth-child(1){grid-column:span 2;grid-row:span 1;height:220px}
 .gallery figure:nth-child(1) img{height:220px}
 .gallery figure:nth-child(1){grid-row:auto}
 .hero h1{font-size:44px}
 .ribbon{font-size:11px}
 .brand{font-size:20px}
 .hero .meta b{font-size:24px}
 .book .img{min-height:260px}
 .book form{padding:34px 22px}
 .fgrid{grid-template-columns:1fr}
 .rcard{width:300px}
 .score .big{font-size:72px}
 .hero .content{padding-bottom:104px}
 .hero .meta{gap:22px}
 .wa-float{display:none}
 .mbar{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px;position:fixed;left:10px;right:10px;bottom:10px;z-index:45;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:8px;box-shadow:0 18px 40px -12px rgba(0,0,0,.5)}
 .mbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:700;text-decoration:none;padding:9px 4px;border-radius:14px;color:var(--ink)}
 .mbar a svg{width:20px;height:20px}
 .mbar a.main{background:#25d366;color:#fff;flex-direction:row;gap:8px;font-size:14px}
}
</style>
</head>
<body>
<div class="ribbon" id="ribbon"></div>

<nav id="nav"><div class="in">
  <a class="brand" href="#top" id="brand"></a>
  <div class="links" id="links"></div>
  <a class="pillbtn" id="navBook" href="#book"></a>
</div></nav>

<header class="hero" id="top">
  <div class="bgimg" id="heroImg"></div>
  <div class="wrap content">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="h1"></h1>
    <p class="lead" id="lead"></p>
    <div class="cta">
      <a class="pillbtn" id="heroWa" target="_blank"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.3.5-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l2 .9c.3.1.5.2.5.3.1.2.1.8-.1 1.4z"/></svg><span id="heroWaTxt"></span></a>
      <a class="pillbtn line" href="#menu" id="heroSecond"></a>
    </div>
    <div class="meta">
      <div><b id="mRating"></b><span class="stars">★★★★★</span></div>
      <div><b id="mCount"></b>Google reviews</div>
      <div><b class="open"><span class="dot"></span><span id="mOpen">Open</span></b><span id="mHours"></span></div>
    </div>
  </div>
</header>

<section id="about"><div class="wrap story">
  <div class="imgs rv"><img id="s1" alt=""><img id="s2" alt=""></div>
  <div class="rv">
    <div class="kicker" id="aboutK"></div>
    <h2 id="aboutH"></h2>
    <p id="aboutP"></p>
    <div class="feats" id="feats"></div>
  </div>
</div></section>

<section id="menu" style="background:var(--bg2)"><div class="wrap">
  <div class="sec-head rv"><div><div class="kicker" id="menuK"></div><h2 id="menuH"></h2></div><p id="menuP"></p></div>
  <div class="menu-tabs rv" id="tabs"></div>
  <div id="menuBody"></div>
</div></section>

<section id="gallery"><div class="wrap">
  <div class="sec-head rv"><div><div class="kicker">Gallery</div><h2 id="galH"></h2></div><p id="galP"></p></div>
  <div class="gallery rv" id="gal"></div>
</div></section>

<section class="rev-band" id="reviews">
  <div class="wrap">
    <div class="score rv"><div class="big" id="rBig"></div><div><div class="stars">★★★★★</div><div id="rTxt" style="color:var(--muted)"></div></div></div>
  </div>
  <div class="marquee" id="marq"></div>
</section>

<section id="book"><div class="wrap">
  <div class="book rv">
    <div class="img" id="bookImg"><div class="cap" id="bookCap"></div></div>
    <form id="form">
      <div class="kicker" id="bookK"></div>
      <h3 id="bookH"></h3>
      <p class="sub" id="bookSub"></p>
      <div class="fgrid" id="fields"></div>
      <button class="pillbtn" type="submit"><span id="bookBtn"></span></button>
      <p class="note">Opens WhatsApp with your request ready to send.</p>
    </form>
  </div>
</div></section>

<section id="visit" style="padding-top:0"><div class="wrap">
  <div class="sec-head rv"><div><div class="kicker">Visit us</div><h2 id="visitH"></h2></div></div>
  <div class="visit rv">
    <div class="vcard">
      <h4>Opening hours</h4>
      <table class="hours" id="hours"></table>
      <h4 style="margin-top:30px">Contact</h4>
      <p id="contact" style="color:var(--muted)"></p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:22px">
        <a class="pillbtn" id="dir" target="_blank">Get directions</a>
      </div>
    </div>
    <div class="map"><iframe id="map" loading="lazy" title="Map"></iframe></div>
  </div>
</div></section>

<footer><div class="wrap">
  <div class="fbig" id="fbig"></div>
  <div class="frow"><span id="fcopy"></span><span class="credit">Designed &amp; built by <a href="https://tekshove.com" target="_blank"><b>TekShove</b></a></span></div>
</div></footer>

const names=CC==='ke'?['Amina','James','Sarah','Lucas','Rehema']:['Emily','Mark','Jessica','Carlos','Anna'];const initials=names.map(n=>n.slice(0,2).toUpperCase());
const cards=D.reviews.map((r,i)=>`<div class="rcard"><div class="stars">★★★★★</div><p>“${r}”</p><div class="who"><div class="av">${initials[i]}</div>${names[i]} · Sample review</div></div>`).join('');
$('marq').innerHTML=cards+cards;
$('bookImg').style.backgroundImage=`url(${U(D.bookImg,1200)})`;$('bookCap').textContent=D.bookCap;
$('bookK').textContent=D.bookK;$('bookH').textContent=D.bookH;$('bookSub').textContent=D.bookSub;$('bookBtn').textContent=D.bookBtn;
$('fields').innerHTML=D.fields.map(f=>`<div class="field${f[3]?' full':''}"><label>${f[0]}</label>${f[2]==='select'?`<select name="${f[1]}">${f[4].map(o=>`<option>${o}</option>`).join('')}</select>`:`<input name="${f[1]}" type="${f[2]}" ${f[2]==='text'?'placeholder="Your full name"':''}>`}</div>`).join('');
$('form').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));window.open(wa(D.msg(v)),'_blank');};
$('visitH').innerHTML=D.visitH;
const today=(new Date().getDay()+6)%7;
$('hours').innerHTML=D.hours.map((r,i)=>`<tr class="${C.type!=='guesthouse'&&C.type!=='tour'&&i===today?'today':''}"><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('');
$('contact').innerHTML=`+${CC==='ke'?C.phone.replace(/^(\d{3})(\d{3})(\d{3})(\d+)$/,'$1 $2 $3 $4'):C.phone.replace(/^(\d{3})(\d{3})(\d+)$/,'$1 $2 $3')}<br>WhatsApp, calls & walk ins welcome<br>${C.town}, ${CN}`;
const mq=encodeURIComponent(C.name+' '+C.town+' '+CN);
$('map').src=`https://maps.google.com/maps?q=${mq}&output=embed`;
$('dir').href=$('mDir').href=`https://www.google.com/maps/search/?api=1&query=${mq}`;
$('mCall').href=`tel:+${C.phone}`;
$('fbig').innerHTML=D.fbig;$('fcopy').textContent=`© ${new Date().getFullYear()} ${C.name}. All rights reserved.`;
const nav=$('nav');addEventListener('scroll',()=>nav.classList.toggle('solid',scrollY>60),{passive:true});
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.12});
document.querySelectorAll('.rv').forEach(el=>io.observe(el));
setTimeout(()=>document.querySelectorAll('.rv').forEach(el=>el.classList.add('in')),4000);
</script>
</body>
</html>
